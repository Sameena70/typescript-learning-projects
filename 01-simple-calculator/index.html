<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeScript Calculator</title>
  <link rel="stylesheet" href="style.css">
  <!-- Link the compiled JavaScript module -->
  <script type="module" src="dist/main.js" defer></script>
</head>
<body>
  <div class="calculator-container">
    <div class="calculator-card">
      <div class="calculator-header">
        <span class="app-title">TypeScript Calculator</span>
        <div class="header-right">
          <span id="memoryIndicator" class="memory-badge" style="display: none;">M: 0</span>
          <button id="toggleHistoryBtn" class="icon-btn" title="View History" type="button">🕒</button>
        </div>
      </div>

      <!-- Calculator Display -->
      <div class="display-screen">
        <div id="historyDisplay" class="history-text"></div>
        <div id="currentDisplay" class="current-text">0</div>
      </div>

      <!-- Memory Row -->
      <div class="memory-grid">
        <button id="mcBtn" class="btn btn-memory" type="button">MC</button>
        <button id="mrBtn" class="btn btn-memory" type="button">MR</button>
        <button id="mPlusBtn" class="btn btn-memory" type="button">M+</button>
        <button id="mMinusBtn" class="btn btn-memory" type="button">M−</button>
      </div>

      <!-- Buttons Grid -->
      <div class="buttons-grid">
        <!-- Row 1: Actions -->
        <button id="clearBtn" class="btn btn-action" type="button">AC</button>
        <button id="deleteBtn" class="btn btn-action" type="button">DEL</button>
        <button id="percentBtn" class="btn btn-action" type="button">%</button>
        <button class="btn btn-operator" data-operator="/" type="button">÷</button>

        <!-- Row 2: 7, 8, 9, Multiply -->
        <button class="btn btn-number" data-number="7" type="button">7</button>
        <button class="btn btn-number" data-number="8" type="button">8</button>
        <button class="btn btn-number" data-number="9" type="button">9</button>
        <button class="btn btn-operator" data-operator="*" type="button">×</button>

        <!-- Row 3: 4, 5, 6, Subtract -->
        <button class="btn btn-number" data-number="4" type="button">4</button>
        <button class="btn btn-number" data-number="5" type="button">5</button>
        <button class="btn btn-number" data-number="6" type="button">6</button>
        <button class="btn btn-operator" data-operator="-" type="button">−</button>

        <!-- Row 4: 1, 2, 3, Add -->
        <button class="btn btn-number" data-number="1" type="button">1</button>
        <button class="btn btn-number" data-number="2" type="button">2</button>
        <button class="btn btn-number" data-number="3" type="button">3</button>
        <button class="btn btn-operator" data-operator="+" type="button">+</button>

        <!-- Row 5: 0, Decimal, Equals -->
        <button class="btn btn-number btn-zero" data-number="0" type="button">0</button>
        <button id="decimalBtn" class="btn btn-number" type="button">.</button>
        <button id="equalsBtn" class="btn btn-equals" type="button">=</button>
      </div>

      <!-- History Drawer (Collapsible) -->
      <div id="historyDrawer" class="history-drawer">
        <div class="drawer-header">
          <span class="drawer-title">Calculation History</span>
          <div class="drawer-actions">
            <button id="clearHistoryBtn" class="btn-text-danger" type="button">Clear</button>
            <button id="closeHistoryBtn" class="btn-text-close" type="button">✕</button>
          </div>
        </div>
        <div id="historyList" class="history-list">
          <!-- History items injected dynamically -->
        </div>
      </div>
    </div>
  </div>
</body>
</html>
